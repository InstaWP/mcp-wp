name: Release

# Publishes the package to npm. Merging a fix never reaches users on its own —
# npm keeps serving the previously published version until this runs.
#
# Normal path: push a `vX.Y.Z` tag on main (see "Releasing" in README.md).
# Recovery path: run this workflow manually with the tag name, for when a tag is
# already pushed but the publish failed or was never wired up.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.1'
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release at the end
  id-token: write # npm provenance

# Two tags pushed back to back must not publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # `npm ci` installs exactly what package-lock.json pins, so a release is
      # built from the same tree that CI tested rather than from whatever the
      # registry resolves at publish time. See the note in test.yml.
      #
      # --ignore-scripts skips the `prepare` hook; the build runs explicitly below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve and verify version
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # Fail before install/build/test rather than on npm's opaque ENEEDAUTH.
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token with publish rights on @instawp under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"

          if [ "$PKG" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG says $TAG_VERSION but package.json says $PKG. Bump package.json and re-tag; publishing a mismatched version is unrecoverable (npm forbids reusing a version)."
            exit 1
          fi

          # An already-published version cannot be republished, so fail here with
          # a clear message rather than on npm's 403.
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already on npm. Bump the version and tag again."
            exit 1
          fi

          # A prerelease must not take over the `latest` dist-tag, which is what
          # a bare `npm install` resolves to.
          case "$PKG" in
            *-*) NPM_TAG=next ;;
            *)   NPM_TAG=latest ;;
          esac

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$PKG from $TAG under dist-tag $NPM_TAG"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        id: publish
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ steps.v.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A green publish step is not proof the registry serves the version. Query
      # the exact version rather than `latest`, which is cached and can lag by
      # several minutes.
      - name: Verify the published version
        env:
          NAME: ${{ steps.v.outputs.name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$NAME@$VERSION is live on npm."
              echo "Published \`$NAME@$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Not visible yet (attempt $attempt/6); waiting 20s."
              sleep 20
            fi
          done
          echo "::error::Published, but $NAME@$VERSION is still not resolvable after ~2 minutes. Check https://www.npmjs.com/package/$NAME before re-running — do NOT assume the publish failed."
          exit 1

      # Without this the repository's Releases page keeps showing the PREVIOUS
      # version as latest, which is worst on a security release: the tag exists
      # and npm serves the fix, but anyone reading the repo — a reporter checking
      # whether we shipped, most of all — sees a stale version and concludes we
      # did not. Runs last, so a failure here cannot affect the publish, and it is
      # idempotent so the workflow_dispatch recovery path can be re-run.
      #
      # Gated on the PUBLISH step, not on the job: `always()` alone would announce
      # "Published to npm" after a publish that failed, and a release note is
      # exactly the kind of plausible artefact nobody re-checks. This condition
      # runs it when the publish succeeded and something AFTER it did not — which
      # is the case that motivated the step, since the registry-propagation check
      # times out on a perfectly good publish.
      - name: Create the GitHub Release
        if: always() && steps.publish.outcome == 'success' && steps.v.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NAME: ${{ steps.v.outputs.name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi

          # The matching CHANGELOG section, if there is one — from the first
          # `## [x.y.z]` heading to the next `## [`.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)

          {
            echo "Published to npm as \`$NAME@$VERSION\`."
            echo
            echo 'Merging a fix does not reach anyone — this tag is what published it, and an already-installed copy stays on its old version until it is upgraded.'
            if [ -n "$NOTES" ]; then
              echo
              echo '---'
              echo "$NOTES"
            fi
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
          echo "Created the GitHub Release for $TAG." >> "$GITHUB_STEP_SUMMARY"
